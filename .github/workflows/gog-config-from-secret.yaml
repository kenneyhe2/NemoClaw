name: gog-config-from-secret

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-config-tar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Decode GOG configuration secret into tarball
        shell: bash
        env:
          GOG_CONFIGURATION: ${{ secrets.GOG_CONFIGURATION }}
        run: |
          set -euo pipefail
          if [[ -z "${GOG_CONFIGURATION:-}" ]]; then
            echo "GOG_CONFIGURATION secret is empty or undefined."
            exit 1
          fi
          echo "${GOG_CONFIGURATION}" | base64 --decode > config.tar.gz
          test -s config.tar.gz

      - name: Upload config.tar.gz artifact
        uses: actions/upload-artifact@v4
        with:
          name: gog-configuration
          path: config.tar.gz
          if-no-files-found: error
